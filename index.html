<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiderman-Club</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        :root {
            --spidey-red: #e23636;
            --spidey-dark-red: #a50d0d;
            --spidey-blue: #1b3a8a;
            --spidey-dark-blue: #0b1e55;
            --web-black: #111111;
        }

        /* Red background with a web-like crisscross pattern */
        body {
            min-height: 100vh;
            background-color: var(--spidey-red);
            background-image:
                repeating-linear-gradient(45deg, transparent 0 28px, rgba(0, 0, 0, 0.35) 28px 30px),
                repeating-linear-gradient(-45deg, transparent 0 28px, rgba(0, 0, 0, 0.35) 28px 30px);
        }

        /* Blue suit panel with a black border */
        .spidey-card {
            width: 100%;
            max-width: 480px;
            background-color: var(--spidey-blue);
            color: white;
            border: 5px solid var(--web-black);
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .header-bar {
            background-color: var(--spidey-red);
            border-bottom: 5px solid var(--web-black);
            border-radius: 10px 10px 0 0;
        }

        .header-bar h3 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 2px 2px 0 var(--web-black);
        }

        .form-control {
            border: 3px solid var(--web-black);
        }

        .btn-spidey {
            background-color: var(--spidey-red);
            color: white;
            font-weight: bold;
            border: 3px solid var(--web-black);
        }

        .btn-spidey:hover {
            background-color: var(--spidey-dark-red);
            color: white;
        }

        /* Result area where Python shows the message */
        #result {
            min-height: 60px;
            font-size: 1.1rem;
            background-color: var(--spidey-dark-blue);
            border-left: 6px solid var(--spidey-red);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="card spidey-card">
        <div class="header-bar p-3 text-center">
            <h3 class="m-0">Spiderman-Club</h3>
        </div>

        <div class="card-body p-4">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" id="first_name" class="form-control mb-3" placeholder="Enter first name">

            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" id="last_name" class="form-control mb-3" placeholder="Enter last name">

            <button type="button" class="btn btn-spidey w-100 mb-3" py-click="view_user">Verify</button>

            <!-- main.py shows the message here using target='result' -->
            <div id="result" class="p-3 rounded"></div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
